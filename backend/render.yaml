services:
  - type: web
    name: lojaAASIAM-2
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false   # URL do frontend na Vercel (ex: https://seu-app.vercel.app)
      - key: API_URL
        sync: false   # URL do próprio backend no Render (ex: https://seu-app.onrender.com)

      # ── Loja: InfinitePay (legado — webhook antigo / rollback) ──
      - key: INFINITEPAY_HANDLE
        sync: false   # Slug da conta InfinitePay

      # ── Mercado Pago (churrasco + loja) ──
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false   # Access Token (TEST-... ou APP_USR-...). Só no backend.
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false   # Chave secreta da assinatura do webhook
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false   # Public Key — servida ao front por /api/loja/config
      - key: LOJA_SHEET_NAME
        value: Pedidos Loja
      - key: LOJA_FEE_PIX_BPS
        sync: false   # Taxa do Pix da loja em pontos-base (vazio = 0)
      # LOJA_FEE_CARD_2X_BPS / _1X_ / _3X_ ... — só para sobrepor a tabela padrão
      - key: CHURRASCO_SHEET_NAME
        value: Inscrições Churrasco
      - key: CHURRASCO_TOKEN_SECRET
        sync: false   # Opcional; vazio, é derivado do segredo do webhook
      - key: COMPROVANTE_SIGNING_SECRET
        sync: false   # Assina o QR Code do comprovante em PDF (openssl rand -hex 32)

      # ── Google Sheets (loja e churrasco) ──
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false   # ID da planilha Google Sheets
      - key: GOOGLE_SHEETS_SHEET_NAME
        value: Pedidos AASIAM
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false   # E-mail da Service Account do Google
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false   # Chave privada PEM com \n escapados
